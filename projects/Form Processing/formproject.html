<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Processing</title>
    <link rel="stylesheet" href="formproject.css">
</head>
<body>

    <header>
        <h1>Gerald's Web Design - Form Processing</h1>
    </header>

    <main>
        <form id="myForm">
            <div>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>
            </div>

            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Enter you valid email address" required>
            </div>

            <div>
                <label for="age">Age:</label>
                <input type="number" id="age" name="age" placeholder="Enter you age" required>
            </div>

            <div>
                <label for="message">Message:</label>
                <textarea id="message" name="message" placeholder="Write your message here" required></textarea>
            </div>

            <div>
                <button type="submit">Submit</button>
            </div>
        </form>

        <div id="responseMessage" style="margin-top:20px; font-weight:bold;"></div>
    </main>

    <footer>
        <p>&copy; 2026 Gerald Ramirez </p>
    </footer>

    <script src="formproject.js"></script>
</body>
</html>
