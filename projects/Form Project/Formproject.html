<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Forms</title>
    <link rel="stylesheet" href="Formproject.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
    <header>
        <h1>Gerald's Web Design</h1>
    </header>
    <main>
        <form id="myForm">
            <fieldset>
                <legend>Sign up</legend>

                <div class="form-row">
                    <label for="firstNameInput">Full Name: </label>
                    <input type="text" name="firstName" id="firstNameInput" placeholder="Full Name" required>
                </div>

                <div class="form-row">
                    <label for="emailInput">Email: </label>
                    <input type="email" name="email" id="emailInput" placeholder="example@email.com" required>
                </div>

                <div class="form-row">
                    <label for="dateInput">Birthdate: </label>
                    <input type="date" name="birthdate" id="dateInput">
                </div>

                <div class="form-row">
                    <label for="age">Age: </label>
                    <input type="number" id="age" name="age" placeholder="At least 18 years old">
                </div>

                <div class="form-row">
                    <label for="password">Password: </label>
                    <input type="password" name="password" id="password" required>
                </div>

                <div class="check-row">
                    <div class="spacer">Gender:</div>
                    <label for="male"><input type="radio" name="gender" value="male" id="male"> Male</label>
                    <label for="female"><input type="radio" name="gender" value="female" id="female" checked> Female</label>
                </div>

                <div class="check-row">
                    <div class="spacer"></div>
                    <label><input type="checkbox" name="agree" required value="on" checked> I agree to the terms.</label>
                </div>

                <div class="form-row">
                    <label for="state">State:</label>
                    <select name="state" id="state">
                        <option value="ca">California</option>
                        <option value="hi" selected>Hawaii</option>
                        <option value="ut">Utah</option>
                        <option value="az">Arizona</option>
                        <option value="tx">Texas</option>
                    </select>
                </div>

                <div class="form-row">
                    <label for="comment">Comment: </label>
                    <textarea name="comment" id="comment"></textarea>
                </div>

                <div class="form-row">
                    <div class="spacer"></div>
                    <input type="submit" value="Sign Up!">
                </div>

            </fieldset>
        </form>

        <div id="responseMessage" style="margin-top:20px; font-weight:bold;"></div>
    </main>

    <footer>
        <p>&copy; 2026. Gerald's Web Design</p>
    </footer>

    <script src="formproject1.js"></script>
</body>
</html>
