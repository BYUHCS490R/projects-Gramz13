<!DOCTYPE html>
<html>
<head lang="en">
    <title>HTML Forms</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="Formproject.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
    <header><h1>Forms</h1></header>
    <main>
        <form action="processing.html" method="post">
            <fieldset>
                <legend>Sign up</legend>
            <div class="form-row">
                <label for="firstNameInput">First Name: </label>
                <input type="text" name="firstName" id="firstNameInput" placeholder="First Name" required>
            </div>
            <div class="form-row">
                <label for="emailInput">Email: </label>
                <input type="email" name="email" id="emailInput" placeholder="example@email.com" required>
            </div>
            <div class="form-row">
                <label for="dateInput">Birthdate: </label>
                <input type="date" name="birthdate" id="dateInput">
            </div>
            <div class="form-row">
                <label for="password">Password: </label>
                <input type="password" name="password" id="password" required>
            </div>
                
            <div class="check-row">
                <div class="spacer">Gender:</div>
                <label><input type="radio" name="gender" value="male"> Male</label>
                <label><input type="radio" name="gender" value="female" checked> Female</label>
            </div>

            <div class="check-row">
                <div class="spacer"></div>
                <label><input type="checkbox" name="agree" required value="on" checked> I agree to the terms.</label>
            </div>

            <div class="form-row">
                <label for="state">State:</label>
                <select name="state" id="state">
                    <option value="ca">California</option>
                    <option value="hi" selected>Hawaii</option>
                    <option value="ut">Utah</option>
                    <option value="az">Arizona</option>
                    <option value="tx">Texas</option>
                </select>
            </div>

            <div class="form-row">
                <label for="comment">Comment: </label>
                <textarea name="comment" id="comment"></textarea>
            </div>

            <div class="form-row">
                <div class="spacer"></div>
                <input type="submit" value="Sign Up!">
            </div>
              </fieldset>   
        </form>
     
    </main>
    <footer>
        <p>&copy; 2026. Gerald's Web Design</p>
    </footer>
</body>
</html>
